<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>Document</title>
  </head>
  <body>
    <div class="flex justify-center">
      <nav>Particle System V3</nav>
      <div class="mt-25 p-5 w-150 h-75">
        <h1 class="p-0 m-0 italic text-2xl font-normal pl-5">Hey,</h1>
        <div
          id="box-grid"
          class="p-5 mt-5 max-w-full max-h-full grid grid-cols-[repeat(25,minmax(0,1fr))] grid-rows-[repeat(10,minmax(0,1fr))] items-center"
        ></div>
        <p class="m-0 p-0 text-xl text-left p-5">
          This is a <span class="italic">website</span> made by Olatokubo
          <span class="text-blue-500">Joseph</span> Solomon, He is a
          <span class="text-red-500">motivated</span>,
          <span class="text-green-500">dedicated</span> and
          <span class="text-yellow-500">reliable</span> person, say
          <span class="text-violet-500">hi</span>.
        </p>

        <p class="italic font-extralight p-5 m-0 text-gray-500">
          made on the 3rd of November 2025.
        </p>

        <div class="pl-5 m-0 mt-5 flex gap-2">
          <button
            class="text-black-500 font-bold bg-white border-gray-500 border-1 border-solid w-25 h-10 rounded-md cursor-pointer hover:border-gray-900 delay-100"
          >
            Back
          </button>
          <button
            class="text-white italic border-2 bg-black w-25 h-10 rounded-md cursor-pointer hover:opacity-75 hover:delay-100"
          >
            next →
          </button>
        </div>
      </div>
    </div>

    <script src="app.js"></script>
  </body>
</html>
